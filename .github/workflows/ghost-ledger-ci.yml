name: ghost-ledger-ci

on:
  push:
    paths:
      - 'packages/ghost-ledger/**'
      - '.github/workflows/ghost-ledger-ci.yml'
  pull_request:
    paths:
      - 'packages/ghost-ledger/**'
      - '.github/workflows/ghost-ledger-ci.yml'

jobs:
  cpp-tests:
    name: Pure C++ Integrity Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./packages/ghost-ledger
        run: yarn install

      - name: Run C++ Core Tests
        working-directory: ./packages/ghost-ledger
        run: yarn test:cpp

  js-lint-test:
    name: TypeScript & JS Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: 'packages/ghost-ledger/yarn.lock'

      - name: Install Dependencies
        working-directory: ./packages/ghost-ledger
        run: yarn install

      - name: Lint TS/JS Code
        working-directory: ./packages/ghost-ledger
        run: yarn lint

      - name: Build TypeScript
        working-directory: ./packages/ghost-ledger
        run: yarn build

      - name: Run JS Unit Tests
        working-directory: ./packages/ghost-ledger
        run: yarn test:js

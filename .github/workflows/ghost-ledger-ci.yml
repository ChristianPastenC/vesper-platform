name: ghost-ledger-ci

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/ghost-ledger/**'
      - '.github/workflows/ghost-ledger-ci.yml'
  pull_request:
    paths:
      - 'packages/ghost-ledger/**'
      - '.github/workflows/ghost-ledger-ci.yml'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  cpp-tests:
    name: Pure C++ Integrity Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./packages/ghost-ledger
        run: yarn install

      - name: Run C++ Core Tests
        working-directory: ./packages/ghost-ledger
        run: yarn test:cpp

  js-lint-test:
    name: TypeScript & JS Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: 'packages/ghost-ledger/yarn.lock'

      - name: Install Dependencies
        working-directory: ./packages/ghost-ledger
        run: yarn install

      - name: Lint TS/JS Code
        working-directory: ./packages/ghost-ledger
        run: yarn lint

      - name: Build TypeScript
        working-directory: ./packages/ghost-ledger
        run: yarn build

      - name: Run JS Unit Tests
        working-directory: ./packages/ghost-ledger
        run: yarn test:js

  report-results:
    name: Final Verification & Results
    needs: [cpp-tests, js-lint-test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Generate Report
        run: |
          echo "# 🛡️ Vesper Ghost Ledger: CI Execution Report" > final_report.md
          echo "### Job Status" >> final_report.md
          echo "- **C++ Tests:** ${{ needs.cpp-tests.result }}" >> final_report.md
          echo "- **TS/JS Tests & Build:** ${{ needs.js-lint-test.result }}" >> final_report.md
          echo "" >> final_report.md
          echo "You can check the full logs in the [Actions tab](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})." >> final_report.md
          
          cat final_report.md >> $GITHUB_STEP_SUMMARY

      - name: Post CI Report to PR or Issue
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('final_report.md', 'utf8');
            if (context.eventName === 'pull_request') {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            } else if (context.eventName === 'workflow_dispatch') {
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Ghost Ledger CI Report - Manual Run ${context.runId}`,
                body: report
              });
            }

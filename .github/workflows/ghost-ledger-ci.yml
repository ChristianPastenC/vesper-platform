name: ghost-ledger-ci

on:
  push:
    paths:
      - 'packages/ghost-ledger/**'
      - '.github/workflows/ghost-ledger-ci.yml'
  pull_request:
    paths:
      - 'packages/ghost-ledger/**'
      - '.github/workflows/ghost-ledger-ci.yml'

jobs:
  cpp-tests:
    name: Pure C++ Integrity Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./packages/ghost-ledger
        run: yarn install

      - name: Run C++ Core Tests
        working-directory: ./packages/ghost-ledger
        run: yarn test:cpp

  js-lint-test:
    name: TypeScript & JS Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: 'packages/ghost-ledger/yarn.lock'

      - name: Install Dependencies
        working-directory: ./packages/ghost-ledger
        run: yarn install

      - name: Lint TS/JS Code
        working-directory: ./packages/ghost-ledger
        run: yarn lint

      - name: Build TypeScript
        working-directory: ./packages/ghost-ledger
        run: yarn build

      - name: Run JS Unit Tests
        working-directory: ./packages/ghost-ledger
        run: yarn test:js

  android-jsi-build:
    name: Android JSI Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: 'examples/demo-mobile/yarn.lock'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Demo App Dependencies
        working-directory: ./examples/demo-mobile
        run: yarn install

      - name: Make gradlew executable
        working-directory: ./examples/demo-mobile/android
        run: chmod +x gradlew

      - name: Build Android App Context (JSI Bindings Check)
        working-directory: ./examples/demo-mobile/android
        run: ./gradlew assembleDebug --no-daemon

  ios-jsi-build:
    name: iOS JSI Compilation
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: 'examples/demo-mobile/yarn.lock'

      - name: Install Demo App Dependencies
        working-directory: ./examples/demo-mobile
        run: yarn install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: examples/demo-mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('examples/demo-mobile/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install iOS Pods
        working-directory: ./examples/demo-mobile/ios
        run: pod install

      - name: Build iOS App Context (JSI Bindings Check)
        working-directory: ./examples/demo-mobile/ios
        run: xcodebuild -workspace SovereignCore.xcworkspace -scheme SovereignCore -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO

name: DevSecOps Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Weekly on Mondays at 03:00 UTC
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  trufflehog-scan:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified=false

  dependency-vulnerabilities:
    name: SAST & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck on Ingestion API
        working-directory: apps/vesper-ingestion
        run: govulncheck ./...
        continue-on-error: true

      - name: Run govulncheck on Demo Backend
        working-directory: examples/demo-backend
        run: govulncheck ./...
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit Console Dependencies
        working-directory: apps/vesper-console
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  security-summary:
    name: Posture & DORA Compliance Report
    needs: [gitleaks-scan, trufflehog-scan, dependency-vulnerabilities]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish Security Summary
        run: |
          echo "# 🛡️ Vesper Platform: DevSecOps Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Engine | Target | Status | Regulatory Alignment |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Gitleaks** | Repository History & Workspaces | ${{ needs.gitleaks-scan.result }} | NIST CSF 2.0 PR.DS-01 |" >> $GITHUB_STEP_SUMMARY
          echo "| **TruffleHog** | Deep Git Commits & Entropy | ${{ needs.trufflehog-scan.result }} | DORA Art. 13 Incident Detection |" >> $GITHUB_STEP_SUMMARY
          echo "| **govulncheck & npm audit** | Go & Node Dependencies | ${{ needs.dependency-vulnerabilities.result }} | NIST CSF 2.0 DE.CM-01 |" >> $GITHUB_STEP_SUMMARY

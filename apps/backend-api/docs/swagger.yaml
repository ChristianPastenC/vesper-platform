definitions:
  challenge.Token:
    properties:
      challenge_id:
        description: |-
          ChallengeID is a human-readable compact identifier derived from the first
          8 bytes of the nonce — useful for correlation in distributed traces.
        type: string
      expires_at:
        description: ExpiresAt is the UTC Unix epoch second at which this challenge
          becomes invalid.
        type: integer
      issued_at:
        description: IssuedAt is the UTC Unix epoch second at which the challenge
          was generated.
        type: integer
      nonce:
        description: Nonce is the hex-encoded random 32-byte value unique to this
          challenge.
        type: string
      signature:
        description: Signature is the hex-encoded HMAC-SHA256 over "nonce:expires_at".
        type: string
    type: object
  domain.CardDetails:
    properties:
      cvc:
        type: string
      expMonth:
        type: integer
      expYear:
        type: integer
      number:
        type: string
    type: object
  domain.Order:
    properties:
      createdAt:
        type: integer
      date:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.OrderItem'
        type: array
      receiptHash:
        type: string
      status:
        type: string
      timeline:
        items:
          $ref: '#/definitions/domain.OrderTimelineEvent'
        type: array
      total:
        type: number
      type:
        description: '"online" | "instore" | "synced_offline"'
        type: string
      userId:
        type: string
    type: object
  domain.OrderItem:
    properties:
      id:
        type: string
      image:
        type: string
      name:
        type: string
      price:
        type: number
      qty:
        type: integer
    type: object
  domain.OrderTimelineEvent:
    properties:
      description:
        type: string
      status:
        type: string
      timestamp:
        type: string
    type: object
  domain.Product:
    properties:
      barcode:
        description: Simulated EAN-13/UPC barcode
        type: string
      category:
        type: string
      description:
        type: string
      id:
        type: integer
      image:
        type: string
      price:
        type: number
      title:
        type: string
    type: object
  domain.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  domain.RegisterRequest:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        type: string
      phone:
        type: string
      username:
        type: string
    type: object
  domain.TransactionBlock:
    properties:
      hash:
        type: string
      index:
        type: integer
      payload:
        type: string
      precedingHash:
        type: string
      timestamp:
        type: integer
    type: object
  domain.User:
    properties:
      avatar:
        type: string
      createdAt:
        type: integer
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
      phone:
        type: string
      username:
        type: string
    type: object
  domain.UserCredentials:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  domain.UserUpdate:
    properties:
      avatar:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      phone:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  handlers.HandshakeResponse:
    properties:
      challenge:
        allOf:
        - $ref: '#/definitions/challenge.Token'
        description: Challenge carries the time-variant token the client must echo
          back.
      encoded_challenge:
        description: |-
          EncodedChallenge is the compact wire-format of the challenge for clients
          that prefer a single opaque string over the structured JSON fields.
        type: string
      server_time:
        description: ServerTime is the current UTC time at which the challenge was
          issued.
        type: string
      status:
        description: Status is "challenge_issued" on success.
        type: string
    type: object
  http.CheckoutRequest:
    properties:
      card:
        $ref: '#/definitions/domain.CardDetails'
      items:
        items:
          $ref: '#/definitions/domain.OrderItem'
        type: array
      ledger:
        items:
          $ref: '#/definitions/domain.TransactionBlock'
        type: array
      total:
        type: number
      use_mock:
        type: boolean
    type: object
  http.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  http.StoreFeature:
    properties:
      geometry:
        properties:
          coordinates:
            items:
              type: number
            type: array
          type:
            type: string
        type: object
      properties:
        properties:
          address:
            type: string
          distance:
            type: string
          hours:
            type: string
          id:
            type: string
          image:
            type: string
          name:
            type: string
        type: object
      type:
        type: string
    type: object
  http.StoresResponse:
    properties:
      features:
        items:
          $ref: '#/definitions/http.StoreFeature'
        type: array
      type:
        type: string
    type: object
  http.SyncRequest:
    properties:
      transactions:
        items:
          $ref: '#/definitions/http.SyncTransaction'
        type: array
    type: object
  http.SyncResponse:
    properties:
      failed:
        type: integer
      results:
        items:
          $ref: '#/definitions/http.SyncResult'
        type: array
      synced:
        type: integer
    type: object
  http.SyncResult:
    properties:
      error:
        type: string
      receiptHash:
        type: string
      status:
        type: string
      transactionId:
        type: string
    type: object
  http.SyncTransaction:
    properties:
      hash:
        type: string
      index:
        type: integer
      payload:
        type: string
      precedingHash:
        type: string
      timestamp:
        type: integer
      transactionId:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/handshake:
    get:
      description: GET issues a new challenge. POST verifies a challenge.
      parameters:
      - description: Required for POST
        in: header
        name: X-Challenge-Token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HandshakeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Issue/Verify Challenge
      tags:
      - Infrastructure
    post:
      description: GET issues a new challenge. POST verifies a challenge.
      parameters:
      - description: Required for POST
        in: header
        name: X-Challenge-Token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HandshakeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Issue/Verify Challenge
      tags:
      - Infrastructure
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns JWT access and refresh tokens.
      parameters:
      - description: User Credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/domain.UserCredentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: User Login
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Issues a new access token and rotating refresh token using a valid
        refresh token.
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Refresh Tokens
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user and returns access and refresh tokens.
      parameters:
      - description: User Registration Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /catalog:
    get:
      description: Fetches products from the catalog (with fallback logic).
      parameters:
      - description: Category filter
        in: query
        name: category
        type: string
      - description: Result limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Product'
            type: array
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Get Product Catalog
      tags:
      - Catalog
  /checkout/instore:
    post:
      consumes:
      - application/json
      description: Processes a new online or in-store payment.
      parameters:
      - description: Checkout Request Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.CheckoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "402":
          description: Payment Required
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Process Payment
      tags:
      - Checkout
  /checkout/online:
    post:
      consumes:
      - application/json
      description: Processes a new online or in-store payment.
      parameters:
      - description: Checkout Request Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.CheckoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "402":
          description: Payment Required
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Process Payment
      tags:
      - Checkout
  /checkout/pay:
    post:
      consumes:
      - application/json
      description: Processes a new online or in-store payment.
      parameters:
      - description: Checkout Request Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.CheckoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "402":
          description: Payment Required
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Process Payment
      tags:
      - Checkout
  /checkout/sync:
    post:
      consumes:
      - application/json
      description: Synchronizes a batch of offline payments with the central ledger.
      parameters:
      - description: Offline Sync Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.SyncRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.SyncResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Sync Offline Payments
      tags:
      - Checkout
  /health:
    get:
      description: Returns a minimal liveness probe.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "405":
          description: Method Not Allowed
          schema:
            additionalProperties: true
            type: object
      summary: Health Check
      tags:
      - Infrastructure
  /orders:
    get:
      description: Retrieves all orders for the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Order'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get User Orders
      tags:
      - Orders
  /orders/{id}:
    get:
      description: Retrieves a specific order by ID for the authenticated user.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Order'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Order by ID
      tags:
      - Orders
  /profile/me:
    get:
      description: Returns the profile details of the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get User Profile
      tags:
      - Profile
    put:
      consumes:
      - application/json
      description: Updates the profile details of the authenticated user.
      parameters:
      - description: User Update Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.UserUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update User Profile
      tags:
      - Profile
  /stores:
    get:
      description: Retrieves a GeoJSON feature collection of physical stores.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.StoresResponse'
      summary: Get Stores List
      tags:
      - Stores
swagger: "2.0"

basePath: /
definitions:
  domain.ApiKey:
    properties:
      bundle_id:
        type: string
      created_at:
        type: string
      key:
        type: string
      last_used:
        type: string
      name:
        type: string
      tenant_id:
        type: string
    type: object
  domain.Metric:
    properties:
      id:
        type: string
      metric_type:
        description: '1: Integrity, 2: Latency'
        type: integer
      timestamp:
        type: string
      value:
        type: number
    type: object
  http.CreateKeyRequest:
    properties:
      bundle_id:
        type: string
      name:
        type: string
    type: object
  http.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  http.LoginResponse:
    properties:
      name:
        type: string
      tenant_id:
        type: string
      token:
        type: string
    type: object
  http.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
host: localhost:8081
info:
  contact: {}
  description: Backend API for the Sovereign Developer Portal and Telemetry Ingestion.
  title: Sovereign Telemetry API
  version: "1.0"
paths:
  /api/v1/b2b/keys:
    delete:
      description: Revoke an API key
      parameters:
      - description: Session token
        in: header
        name: Authorization
        required: true
        type: string
      - description: API Key to delete
        in: query
        name: key
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Key is required
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal error
          schema:
            type: string
      summary: Delete API Key
      tags:
      - Auth
    get:
      description: List all API keys for the tenant
      parameters:
      - description: Session token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.ApiKey'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal error
          schema:
            type: string
      summary: List API Keys
      tags:
      - Auth
    post:
      consumes:
      - application/json
      description: Create a new API key for the tenant (Max 1)
      parameters:
      - description: Session token (e.g. session_tenantID)
        in: header
        name: Authorization
        required: true
        type: string
      - description: API Key details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.CreateKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Created
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "409":
          description: API Key limit reached
          schema:
            type: string
        "500":
          description: Internal error
          schema:
            type: string
      summary: Create API Key
      tags:
      - Auth
  /api/v1/b2b/login:
    post:
      consumes:
      - application/json
      description: Authenticate a tenant and receive a session token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.LoginResponse'
        "400":
          description: Invalid request format
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Login tenant
      tags:
      - Auth
  /api/v1/b2b/metrics:
    get:
      description: Get telemetry metrics for the tenant
      parameters:
      - description: Session token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Metric'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal error
          schema:
            type: string
      summary: Get Metrics
      tags:
      - Metrics
  /api/v1/b2b/signup:
    post:
      consumes:
      - application/json
      description: Register a new B2B tenant
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.LoginResponse'
        "400":
          description: Invalid request format
          schema:
            type: string
        "409":
          description: Email already in use
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Register tenant
      tags:
      - Auth
  /api/v1/support/ping:
    get:
      description: Wake up or health check
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Server Ping
      tags:
      - System
  /api/v1/support/telemetry/:
    post:
      consumes:
      - application/octet-stream
      description: Ingest binary telemetry dumps from the mobile SDK
      parameters:
      - description: API Key
        in: header
        name: X-Sovereign-API-Key
        required: true
        type: string
      - description: Bundle ID of the mobile app
        in: header
        name: X-Bundle-ID
        required: true
        type: string
      - description: Binary telemetry payload
        in: body
        name: payload
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - text/plain
      responses:
        "202":
          description: Accepted
          schema:
            type: string
        "400":
          description: Invalid payload format
          schema:
            type: string
        "401":
          description: Tenant identity missing
          schema:
            type: string
      summary: Ingest Telemetry
      tags:
      - Telemetry
swagger: "2.0"

openapi: 3.0.0
info:
  title: Sovereign Telemetry API
  description: Backend API for the Sovereign B2B Developer Portal and Mobile SDK Telemetry Ingestion.
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8081
    description: Local development server
paths:
  /api/v1/b2b/signup:
    post:
      summary: Register a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request
        '409':
          description: Email already in use

  /api/v1/b2b/login:
    post:
      summary: Login to an existing tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Successfully logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized

  /api/v1/b2b/keys:
    get:
      summary: List all API keys for the tenant
      security:
        - SessionAuth: []
      responses:
        '200':
          description: List of keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
    post:
      summary: Generate a new API key
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Production SDK Key"
      responses:
        '201':
          description: Successfully created key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'

  /api/v1/b2b/metrics:
    get:
      summary: Retrieve real-time telemetry metrics
      security:
        - SessionAuth: []
      responses:
        '200':
          description: List of metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Metric'

  /api/v1/support/telemetry:
    post:
      summary: Ingest binary telemetry from the Sovereign SDK
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: 17-byte struct (1 byte type, 8 bytes timestamp, 8 bytes float64 value)
      responses:
        '202':
          description: Telemetry accepted
        '400':
          description: Invalid payload size
        '401':
          description: Missing or invalid API Key

components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Session token format "session_{tenant_id}"
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Sovereign-API-Key

  schemas:
    AuthRequest:
      type: object
      required:
        - email
        - password
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        tenant_id:
          type: string
        name:
          type: string
          
    ApiKey:
      type: object
      properties:
        key:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used:
          type: string
          format: date-time
          
    Metric:
      type: object
      properties:
        id:
          type: string
        metric_type:
          type: integer
          description: 1 for Integrity, 2 for Latency
        value:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time

services:
  - type: web
    name: demo-backend
    env: go
    plan: free
    rootDir: examples/demo-backend
    buildCommand: "go mod download && go test ./... && go build -o server ./cmd/server"
    startCommand: "./server"
    envVars:
      - key: PAYLOAD_SECRET_KEY
        generateValue: true
      - key: ECDSA_PRIVATE_KEY_PEM
        sync: false
